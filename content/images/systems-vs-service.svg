<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1586 992" role="img" aria-labelledby="title desc">
  <title id="title">Systems versus service comparison</title>
  <desc id="desc">A comparison between product-led vertical gardening systems and service-led operating outcomes.</desc>
  <rect width="1586" height="992" fill="#fffaf0"/>
  <text x="100" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#173f35">Compare the remaining work</text>
  <rect x="120" y="190" width="620" height="650" rx="32" fill="#f6f0e4" stroke="#173f35" stroke-width="5"/>
  <rect x="846" y="190" width="620" height="650" rx="32" fill="#e7edd8" stroke="#173f35" stroke-width="5"/>
  <g font-family="Arial, sans-serif" fill="#173f35">
    <text x="182" y="276" font-size="40" font-weight="700">Product-led</text>
    <text x="908" y="276" font-size="40" font-weight="700">Service-led</text>
    <text x="182" y="365" font-size="30">Equipment purchase</text>
    <text x="182" y="430" font-size="30">Customer operates</text>
    <text x="182" y="495" font-size="30">Internal training</text>
    <text x="182" y="560" font-size="30">Ad hoc troubleshooting</text>
    <text x="182" y="625" font-size="30">Unclear reporting owner</text>
    <text x="908" y="365" font-size="30">Managed installation</text>
    <text x="908" y="430" font-size="30">Crop operations included</text>
    <text x="908" y="495" font-size="30">Field service cadence</text>
    <text x="908" y="560" font-size="30">Monitoring and response</text>
    <text x="908" y="625" font-size="30">Buyer-ready reporting</text>
  </g>
  <path d="M740 520h106" stroke="#d9a441" stroke-width="14" stroke-linecap="round"/>
  <path d="M816 485l40 35-40 35" fill="none" stroke="#d9a441" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
