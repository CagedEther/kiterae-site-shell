    <circle cx="430" cy="700" r="92" fill="#f1d9a6" stroke="#173f35" stroke-width="5"/>
    <text x="364" y="708">Campus</text>
  </g>
  <g fill="#9ccf7a">
    <circle cx="145" cy="805" r="28"/><circle cx="205" cy="805" r="28"/><circle cx="265" cy="805" r="28"/>
  </g>
  <text x="110" y="875" font-family="Arial, sans-serif" font-size="24" fill="#173f35">Monitoring, technicians, crop planning, response</text>
